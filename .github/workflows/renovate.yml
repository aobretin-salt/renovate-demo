name: Renovate

on:
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v43
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

        env:
          LOG_LEVEL: info