name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    permissions:
      security-events: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: java

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4